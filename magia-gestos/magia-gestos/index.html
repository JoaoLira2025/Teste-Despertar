<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Magia de Gestos</title>
    <style>
      html, body { 
        margin: 0; 
        height: 100%; 
        background: #05050a; 
        color: #cfd6ff; 
        font-family: system-ui, sans-serif; 
        overflow: hidden; /* Evita barras de rolagem */
      }

      /* O palco agora ocupa tudo, sem centralizar o vídeo num quadrado */
      #stage { 
        position: relative; 
        width: 100vw; 
        height: 100vh; 
      }

      /* Vídeo e Canvas ocupam a tela toda */
      video, canvas { 
        position: absolute; 
        top: 0;
        left: 0;
        width: 100%; 
        height: 100%; 
        object-fit: cover; /* Preenche a tela cortando o excesso sem distorcer */
        transform: scaleX(-1); /* Espelha */
      }

      /* Deixa o vídeo um pouco mais visível (0.35 tava muito escuro) */
      video { 
        opacity: 0.6; 
        pointer-events: none;
      }

      /* Canvas acima do vídeo */
      canvas {
        pointer-events: none; 
      }
      #gl {
  mix-blend-mode: screen;
}

      #status { 
        position: fixed; 
        top: 20px; 
        left: 20px; 
        z-index: 2; 
        font-size: 16px; 
        opacity: .8; 
        text-shadow: 1px 1px 2px #000;
      }

      #start { 
        position: fixed; 
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 3; 
        padding: 14px 28px; 
        font-size: 18px; 
        border: 0; 
        border-radius: 10px; 
        background: #6c5cff; 
        color: #fff; 
        cursor: pointer; 
        box-shadow: 0 0 20px rgba(108, 92, 255, 0.5);
        transition: transform 0.2s;
      }

      #start:hover {
        transform: translate(-50%, -50%) scale(1.05);
      }

      /* Estilo para a legenda que estava sem formatação */
      #legend {
        position: fixed;
        bottom: 20px;
        left: 20px;
        z-index: 2;
        font-size: 14px;
        line-height: 1.6;
        background: rgba(5,5,10,.65);
        padding: 12px 16px;
        border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.1);
        backdrop-filter: blur(5px);
      }
      #legend b { color: #fff; }
    </style>
  </head>
  <body>
    <div id="status">Clique em iniciar para ativar a câmera</div>
    
    <div id="legend">
      <b>Gestos</b><br />
      ✋ Palma aberta → escudo<br />
      🤏 Dedos em "L" → raio<br />
      👌 Pinça → luz angelical<br />
      ✊ Punho → fogo 
    </div>

    <button id="start">Iniciar Magia</button>

    <div id="stage">
      <video id="video" playsinline muted></video>
      <canvas id="gl"></canvas>
      
      
      <canvas id="overlay"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
